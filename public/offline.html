<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISZTRANSPORT — Hors ligne</title>
  <meta name="theme-color" content="#059669" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 60%);
      color: #0f2a21;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #d1fae5;
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(5, 150, 105, 0.12);
    }
    .icon {
      width: 72px; height: 72px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #059669;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 8px; color: #064e3b; }
    p { font-size: 0.95rem; color: #4b5563; line-height: 1.55; margin-bottom: 22px; }
    button {
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px 26px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
    }
    button:hover { background: #047857; }
    .hint { margin-top: 16px; font-size: 0.8rem; color: #9ca3af; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🚕</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      L&apos;application <strong>ISZTRANSPORT</strong> n&apos;a pas encore été chargée sur cet
      appareil. Reconnectez-vous une première fois : après cela, l&apos;application
      fonctionnera entièrement sans connexion Internet.
    </p>
    <button onclick="location.reload()">Réessayer</button>
    <p class="hint">Vos données restent enregistrées en toute sécurité sur cet appareil.</p>
  </main>
</body>
</html>
